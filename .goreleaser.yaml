version: 2

project_name: vsg

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - id: vsg
    main: .
    binary: vsg
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/pavlenkoa/vault-secrets-generator/internal/command.Version={{.Version}}
      - -X github.com/pavlenkoa/vault-secrets-generator/internal/command.Commit={{.Commit}}
      - -X github.com/pavlenkoa/vault-secrets-generator/internal/command.BuildDate={{.Date}}

# Only the Docker image is shipped from this fork.
archives:
  - formats:
      - binary

checksum:
  disable: true

changelog:
  disable: true

release:
  disable: true

snapshot:
  version_template: "{{ incpatch .Version }}-next"

dockers_v2:
  - id: default
    ids:
      - vsg
    dockerfile: Dockerfile.goreleaser
    images:
      - "proteantecs/vault-secrets-generator"
    tags:
      - "{{ .Version }}"
      - "latest"
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      "org.opencontainers.image.title": "{{ .ProjectName }}"
      "org.opencontainers.image.description": "Vault Secrets Generator"
      "org.opencontainers.image.url": "https://github.com/proteantecs/vault-secrets-generator"
